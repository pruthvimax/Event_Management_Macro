<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eventum | Full CRUD Lifecycle</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cormorant Garamond', serif; background-color: #F5F5F0; }
        .font-sans { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="text-[#1A1A1A]">
    <nav class="border-b border-black/10 px-8 py-6 flex justify-between items-center bg-white/50 backdrop-blur-md sticky top-0 z-50">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 bg-black rounded-full flex items-center justify-center text-white italic text-xl">E</div>
            <h1 class="text-2xl font-bold tracking-tight italic">Eventum</h1>
        </div>
        <div class="flex gap-4">
            <button onclick="openModal()" class="bg-[#5A5A40] text-white px-6 py-2 rounded-full hover:bg-[#4A4A30] transition-all text-sm uppercase tracking-widest font-sans font-semibold">
                + New Event
            </button>
        </div>
    </nav>

    <main class="max-w-6xl mx-auto px-8 py-12">
        <header class="mb-12 flex flex-col md:flex-row md:items-end justify-between gap-8">
            <div class="max-w-xl">
                <h2 class="text-6xl font-light tracking-tight mb-4">Upcoming <span class="italic">Experiences</span></h2>
                <p class="text-black/60 text-lg font-sans">Full CRUD lifecycle implemented with Go and MongoDB.</p>
            </div>
            
            <div class="relative w-full md:w-80">
                <input type="text" id="searchInput" oninput="handleSearch()" placeholder="Search events..." class="w-full bg-white border border-black/5 rounded-full py-4 px-6 focus:ring-2 focus:ring-[#5A5A40] outline-none shadow-sm transition-all font-sans text-sm">
            </div>
        </header>

        <div id="eventList" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
            <!-- Events will be rendered here via Go html/template range loops in a real Go app -->
            <!-- For this template, we show the structure -->
            <div class="bg-white rounded-[32px] p-8 shadow-sm border border-black/5 flex flex-col h-full">
                <div class="flex justify-between items-start mb-6">
                    <div class="bg-[#F5F5F0] px-4 py-1 rounded-full text-xs font-sans font-bold uppercase tracking-widest">
                        March 25, 2026
                    </div>
                    <div class="flex gap-2">
                        <button class="text-black/20 hover:text-black"><Edit size="16"/></button>
                        <button class="text-black/20 hover:text-red-500"><Trash size="16"/></button>
                    </div>
                </div>
                <h3 class="text-2xl font-bold mb-3">Sample Event</h3>
                <p class="text-black/60 text-sm mb-8 flex-grow leading-relaxed italic">Description goes here...</p>
                <div class="flex items-center justify-between pt-6 border-t border-black/5">
                    <span class="text-sm font-sans font-semibold">0 RSVPs</span>
                    <button class="bg-black text-white px-6 py-2 rounded-full text-xs font-sans font-bold uppercase tracking-widest hover:bg-[#5A5A40] transition-all">
                        RSVP NOW
                    </button>
                </div>
            </div>
        </div>
    </main>

    <!-- Modal for Create/Update -->
    <div id="eventModal" class="fixed inset-0 hidden z-[100] flex items-center justify-center p-4 bg-black/40 backdrop-blur-sm">
        <div class="bg-white rounded-[40px] w-full max-w-lg p-10 shadow-2xl">
            <h3 id="modalTitle" class="text-3xl font-bold mb-8 italic">New Event</h3>
            <form id="eventForm" class="space-y-6">
                <!-- Form fields for Title, Date, Location, Description -->
                <button type="submit" class="w-full bg-black text-white px-6 py-4 rounded-2xl font-sans font-bold uppercase tracking-widest text-xs">Save Experience</button>
            </form>
        </div>
    </div>

    <script>
        // Logic for Fetch API calls to Go Backend
        async function fetchEvents(query = "") {
            const res = await fetch(`/api/events?search=${query}`);
            const events = await res.json();
            // Render logic...
        }
        
        function handleSearch() {
            const query = document.getElementById('searchInput').value;
            fetchEvents(query);
        }
        
        // Modal and CRUD logic...
    </script>
</body>
</html>
